name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04  # compile-sketches@v1 needs Python 3.12.4, not available on 26.04
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: false
          compliance: specification

  compile:
    name: compile (${{ matrix.board }})
    runs-on: ubuntu-24.04  # compile-sketches@v1 needs Python 3.12.4, not available on 26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            sketch-paths: |
              - examples/PN5180-Library
              - examples/PN5180-ReadUID
              - examples/PN5180-ReadMultipleUID
              - examples/PN5180-MultipleBlock
              - examples/PN5180-ISO14443
              - examples/PN5180-LowPowerCardDetection
          - board: esp32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketch-paths: |
              - examples
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketch-paths }}
          libraries: |
            - source-path: ./
          enable-warnings-report: true
